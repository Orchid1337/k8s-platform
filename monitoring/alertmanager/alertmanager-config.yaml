# Alertmanager configuration for the k8s-platform
# Routes alerts to appropriate channels based on severity
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: k8s-platform
type: Opaque
stringData:
  alertmanager.yml: |
    # Global configuration
    global:
      resolve_timeout: 5m
      # Slack webhook URL — replace with actual webhook in production
      slack_api_url: "https://hooks.slack.com/services/PLACEHOLDER/WEBHOOK/URL"

    # Notification templates
    templates:
      - '/etc/alertmanager/templates/*.tmpl'

    # Routing tree — determines which receiver handles each alert
    route:
      # Default receiver for unmatched alerts
      receiver: slack-warning
      # Group alerts by these labels to reduce noise
      group_by: [alertname, cluster, namespace]
      # Wait before sending the first notification for a new group
      group_wait: 30s
      # Wait before sending updates for an existing group
      group_interval: 5m
      # Wait before re-sending a notification that has already been sent
      repeat_interval: 4h

      # Child routes — more specific matching
      routes:
        # Critical alerts go to the critical channel with shorter intervals
        - receiver: slack-critical
          matchers:
            - severity = critical
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 1h
          continue: false

        # Warning alerts go to the warning channel
        - receiver: slack-warning
          matchers:
            - severity = warning
          continue: false

        # Platform team alerts
        - receiver: slack-platform
          matchers:
            - team = platform
          continue: true

    # Receivers — define notification channels
    receivers:
      - name: slack-critical
        slack_configs:
          - channel: "#alerts-critical"
            send_resolved: true
            title: '{{ "{{ .Status | toUpper }}" }} | {{ "{{ .CommonLabels.alertname }}" }}'
            text: >-
              {{ "{{ range .Alerts }}" }}
              *Alert:* {{ "{{ .Annotations.summary }}" }}
              *Description:* {{ "{{ .Annotations.description }}" }}
              *Severity:* {{ "{{ .Labels.severity }}" }}
              *Namespace:* {{ "{{ .Labels.namespace }}" }}
              {{ "{{ end }}" }}
            color: '{{ "{{ if eq .Status \"firing\" }}" }}danger{{ "{{ else }}" }}good{{ "{{ end }}" }}'

      - name: slack-warning
        slack_configs:
          - channel: "#alerts-warning"
            send_resolved: true
            title: '{{ "{{ .Status | toUpper }}" }} | {{ "{{ .CommonLabels.alertname }}" }}'
            text: >-
              {{ "{{ range .Alerts }}" }}
              *Alert:* {{ "{{ .Annotations.summary }}" }}
              *Description:* {{ "{{ .Annotations.description }}" }}
              {{ "{{ end }}" }}
            color: '{{ "{{ if eq .Status \"firing\" }}" }}warning{{ "{{ else }}" }}good{{ "{{ end }}" }}'

      - name: slack-platform
        slack_configs:
          - channel: "#platform-alerts"
            send_resolved: true
            title: '[Platform] {{ "{{ .CommonLabels.alertname }}" }}'
            text: >-
              {{ "{{ range .Alerts }}" }}
              *Alert:* {{ "{{ .Annotations.summary }}" }}
              *Node:* {{ "{{ .Labels.instance }}" }}
              {{ "{{ end }}" }}

    # Inhibition rules — suppress less severe alerts when critical ones fire
    inhibit_rules:
      # If a critical alert fires, suppress warnings for the same alertname
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: [alertname, cluster, namespace]

# Vault configuration for Kubernetes authentication and secret engines
# This is applied after Vault is running using the vault CLI or API
---
# ConfigMap containing Vault initialization script
# Run this after Vault pod is ready to configure auth and secrets
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-init-config
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: k8s-platform
data:
  init.sh: |
    #!/bin/sh
    # Wait for Vault to be ready
    until vault status 2>/dev/null; do
      echo "Waiting for Vault to start..."
      sleep 2
    done

    echo "Configuring Vault..."

    # Enable Kubernetes auth method
    # This allows pods to authenticate using their ServiceAccount tokens
    vault auth enable kubernetes 2>/dev/null || true

    vault write auth/kubernetes/config \
      kubernetes_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" \
      token_reviewer_jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
      kubernetes_ca_cert="$(cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)"

    # Enable KV v2 secrets engine for application secrets
    vault secrets enable -path=secret kv-v2 2>/dev/null || true

    # Create a policy for the sample-app
    vault policy write sample-app - <<EOF
    path "secret/data/app/*" {
      capabilities = ["read", "list"]
    }
    path "secret/metadata/app/*" {
      capabilities = ["read", "list"]
    }
    EOF

    # Create a Kubernetes auth role for the sample-app
    vault write auth/kubernetes/role/sample-app \
      bound_service_account_names=sample-app \
      bound_service_account_namespaces=app \
      policies=sample-app \
      ttl=1h

    # Seed initial secrets for the application
    vault kv put secret/app/config \
      database_url="postgresql://app:password@postgres:5432/appdb" \
      redis_url="redis://redis:6379/0" \
      api_key="development-api-key-replace-in-production"

    echo "Vault configuration complete."
---
# Job to run the initialization script after Vault is deployed
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-init
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: k8s-platform
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: vault
      restartPolicy: OnFailure
      containers:
        - name: vault-init
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "/config/init.sh"]
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              value: "root"
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: vault-init-config
            defaultMode: 0755

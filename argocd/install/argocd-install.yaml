# ArgoCD installation manifest
# Uses the official HA installation manifest with custom patches for the platform
# Reference: https://argo-cd.readthedocs.io/en/stable/operator-manual/installation/
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: k8s-platform
    environment: platform
    team: platform
---
# Install ArgoCD using the official non-HA manifest (suitable for local/dev)
# In production, use the HA manifest instead
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
data:
  # Run ArgoCD server in insecure mode behind ingress (TLS terminated at ingress)
  server.insecure: "true"
  # Enable status badge for repositories
  statusbadge.enabled: "true"
  # Application resync period (default 3m, set to 1m for faster GitOps feedback)
  timeout.reconciliation: "60s"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  # Repository configuration — the platform repo itself
  repositories: |
    - url: https://github.com/Orchid1337/k8s-platform.git
      type: git
      name: k8s-platform
  # Resource tracking method — annotation-based for better compatibility
  application.resourceTrackingMethod: annotation
  # Health assessments for custom resources
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
---
# ArgoCD RBAC configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
data:
  # Default policy: read-only for authenticated users
  policy.default: role:readonly
  policy.csv: |
    # Platform admins can do everything
    p, role:platform-admin, applications, *, */*, allow
    p, role:platform-admin, clusters, *, *, allow
    p, role:platform-admin, repositories, *, *, allow
    p, role:platform-admin, projects, *, *, allow
    # Developers can sync and view apps in their namespace
    p, role:developer, applications, get, */*, allow
    p, role:developer, applications, sync, */*, allow
    p, role:developer, logs, get, */*, allow
    # Bind admin group
    g, admin, role:platform-admin

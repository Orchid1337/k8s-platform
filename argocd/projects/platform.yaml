# ArgoCD AppProject — defines boundaries for what applications can deploy
# Restricts source repositories, destination namespaces, and allowed resources
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: k8s-platform
  # Finalizer prevents accidental deletion of the project while apps exist
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "K8s Platform project — manages all platform applications"

  # Only allow deployments from our repository
  sourceRepos:
    - https://github.com/Orchid1337/k8s-platform.git
    - https://kubernetes.github.io/ingress-nginx
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts

  # Restrict which namespaces applications can deploy to
  destinations:
    - namespace: app
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: ingress-nginx
      server: https://kubernetes.default.svc
    - namespace: vault
      server: https://kubernetes.default.svc
    - namespace: cert-manager
      server: https://kubernetes.default.svc

  # Allow these cluster-scoped resources to be managed
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: networking.k8s.io
      kind: IngressClass
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration

  # Namespace-scoped resources allowed in any destination namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: batch
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    - group: autoscaling
      kind: "*"
    - group: policy
      kind: "*"
    - group: monitoring.coreos.com
      kind: "*"

  # Orphaned resource monitoring — detect resources not managed by any app
  orphanedResources:
    warn: true

# Ansible inventory for the k8s-platform
# For local development with kind/k3s, we target localhost
# In a real environment, replace with actual node IPs
---
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: /usr/bin/python3
    k8s_cluster_name: k8s-platform
    kubeconfig_path: "{{ playbook_dir }}/../../kubeconfig"

  children:
    control_plane:
      hosts:
        localhost:
          ansible_host: 127.0.0.1
          node_role: control-plane

    workers:
      hosts:
        # In a multi-node setup, list worker nodes here
        # worker-1:
        #   ansible_host: 192.168.1.11
        # worker-2:
        #   ansible_host: 192.168.1.12
        localhost:
          ansible_host: 127.0.0.1
          node_role: worker

    k8s_cluster:
      children:
        control_plane:
        workers:

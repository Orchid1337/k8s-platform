# k3s role — installs k3s server on control-plane and agent on workers
---
- name: Download k3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: /tmp/k3s-install.sh
    mode: "0755"
  changed_when: false

# -------------------------------------------------------------------------
# Install k3s server on control-plane nodes
# -------------------------------------------------------------------------
- name: Install k3s server
  when: node_role == "control-plane"
  block:
    - name: Run k3s server install
      ansible.builtin.command: >
        /tmp/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "server {{ k3s_server_args | join(' ') }}"
        K3S_KUBECONFIG_MODE: "644"
      changed_when: true

    - name: Wait for k3s to be ready
      ansible.builtin.command: kubectl get nodes
      register: k3s_nodes
      until: k3s_nodes.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      environment:
        KUBECONFIG: "{{ k3s_kubeconfig_src }}"

    - name: Get k3s node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token

    - name: Store token as fact for workers
      ansible.builtin.set_fact:
        k3s_node_token: "{{ k3s_token.content | b64decode | trim }}"

# -------------------------------------------------------------------------
# Install k3s agent on worker nodes
# -------------------------------------------------------------------------
- name: Install k3s agent
  when: node_role == "worker" and k3s_node_token is defined
  block:
    - name: Run k3s agent install
      ansible.builtin.command: >
        /tmp/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "agent {{ k3s_agent_args | join(' ') }}"
        K3S_URL: "https://{{ hostvars[groups['control_plane'][0]]['ansible_default_ipv4']['address'] }}:6443"
        K3S_TOKEN: "{{ k3s_node_token }}"
      changed_when: true

# -------------------------------------------------------------------------
# Post-install configuration
# -------------------------------------------------------------------------
- name: Create .kube directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: "0700"
  when: node_role == "control-plane"

- name: Copy kubeconfig to user home
  ansible.builtin.copy:
    src: "{{ k3s_kubeconfig_src }}"
    dest: "{{ k3s_kubeconfig_dest }}"
    remote_src: true
    mode: "0600"
  when: node_role == "control-plane"

- name: Wait for all nodes to be Ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready nodes --all --timeout={{ k3s_wait_timeout }}s
  environment:
    KUBECONFIG: "{{ k3s_kubeconfig_dest }}"
  changed_when: false
  when: node_role == "control-plane"

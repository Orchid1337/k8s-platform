# Common role — prepares nodes for Kubernetes installation
---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install required packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present

- name: Disable swap (required for Kubernetes)
  when: common_disable_swap
  block:
    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: true

    - name: Remove swap from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "\\sswap\\s"
        state: absent

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Ensure kernel modules load on boot
  ansible.builtin.copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/kubernetes.conf
    mode: "0644"

- name: Apply sysctl settings for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ common_sysctl_settings | dict2items }}"

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Configure journald for structured logging
  ansible.builtin.copy:
    content: |
      [Journal]
      Storage=persistent
      Compress=yes
      SystemMaxUse=1G
      MaxRetentionSec=7day
    dest: /etc/systemd/journald.conf.d/k8s-platform.conf
    mode: "0644"
  notify: Restart journald

handlers:
  - name: Restart journald
    ansible.builtin.systemd:
      name: systemd-journald
      state: restarted

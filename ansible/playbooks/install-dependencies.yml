# Install Dependencies Playbook
# Installs cert-manager, ingress-nginx, and other cluster dependencies
---
- name: Install Cluster Dependencies
  hosts: control_plane
  gather_facts: false

  vars:
    kubeconfig: "{{ ansible_env.HOME }}/.kube/config"
    cert_manager_version: "1.14.3"
    ingress_nginx_version: "4.9.1"

  tasks:
    # -------------------------------------------------------------------------
    # cert-manager — TLS certificate management
    # -------------------------------------------------------------------------
    - name: Add Jetstack Helm repository
      kubernetes.core.helm_repository:
        name: jetstack
        repo_url: https://charts.jetstack.io

    - name: Install cert-manager
      kubernetes.core.helm:
        name: cert-manager
        chart_ref: jetstack/cert-manager
        chart_version: "{{ cert_manager_version }}"
        release_namespace: cert-manager
        create_namespace: true
        kubeconfig: "{{ kubeconfig }}"
        values:
          installCRDs: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

    - name: Wait for cert-manager webhook to be ready
      kubernetes.core.k8s_info:
        kind: Deployment
        name: cert-manager-webhook
        namespace: cert-manager
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        wait_timeout: 120
        wait_condition:
          type: Available
          status: "True"

    - name: Create ClusterIssuer for Let's Encrypt staging
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-staging
          spec:
            acme:
              server: https://acme-staging-v02.api.letsencrypt.org/directory
              email: admin@example.com
              privateKeySecretRef:
                name: letsencrypt-staging-key
              solvers:
                - http01:
                    ingress:
                      class: nginx

    # -------------------------------------------------------------------------
    # ingress-nginx — Ingress controller
    # -------------------------------------------------------------------------
    - name: Add ingress-nginx Helm repository
      kubernetes.core.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx

    - name: Install ingress-nginx
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        chart_version: "{{ ingress_nginx_version }}"
        release_namespace: ingress-nginx
        create_namespace: true
        kubeconfig: "{{ kubeconfig }}"
        values:
          controller:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
            metrics:
              enabled: true
            service:
              type: NodePort
              nodePorts:
                http: 30080
                https: 30443
            admissionWebhooks:
              enabled: true

    - name: Wait for ingress-nginx controller to be ready
      kubernetes.core.k8s_info:
        kind: Deployment
        name: ingress-nginx-controller
        namespace: ingress-nginx
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        wait_timeout: 120
        wait_condition:
          type: Available
          status: "True"

    - name: Print dependency installation status
      ansible.builtin.debug:
        msg: |
          All dependencies installed successfully:
          - cert-manager {{ cert_manager_version }}
          - ingress-nginx {{ ingress_nginx_version }}

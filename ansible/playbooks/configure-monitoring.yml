# Configure Monitoring Playbook
# Installs kube-prometheus-stack, Loki, and applies custom dashboards
---
- name: Configure Monitoring Stack
  hosts: control_plane
  gather_facts: false

  vars:
    kubeconfig: "{{ ansible_env.HOME }}/.kube/config"
    prometheus_stack_version: "56.6.2"
    loki_stack_version: "2.10.0"

  tasks:
    # -------------------------------------------------------------------------
    # kube-prometheus-stack (Prometheus + Grafana + Alertmanager)
    # -------------------------------------------------------------------------
    - name: Add Prometheus community Helm repository
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    - name: Install kube-prometheus-stack
      kubernetes.core.helm:
        name: prometheus
        chart_ref: prometheus-community/kube-prometheus-stack
        chart_version: "{{ prometheus_stack_version }}"
        release_namespace: monitoring
        create_namespace: true
        kubeconfig: "{{ kubeconfig }}"
        values:
          # Grafana configuration
          grafana:
            enabled: true
            adminPassword: "admin"
            persistence:
              enabled: false
            sidecar:
              dashboards:
                enabled: true
                label: grafana_dashboard
                labelValue: "1"
                searchNamespace: ALL
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi

          # Prometheus configuration
          prometheus:
            prometheusSpec:
              retention: 7d
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              # Discover all PrometheusRules regardless of labels
              ruleSelector: {}
              ruleSelectorNilUsesHelmValues: false
              serviceMonitorSelector: {}
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelector: {}
              podMonitorSelectorNilUsesHelmValues: false

          # Alertmanager configuration
          alertmanager:
            enabled: true
            alertmanagerSpec:
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi

          # Node exporter for host metrics
          nodeExporter:
            enabled: true

          # kube-state-metrics for Kubernetes object metrics
          kubeStateMetrics:
            enabled: true

    - name: Wait for Prometheus to be ready
      kubernetes.core.k8s_info:
        kind: StatefulSet
        name: prometheus-prometheus-kube-prometheus-prometheus
        namespace: monitoring
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        wait_timeout: 300

    # -------------------------------------------------------------------------
    # Loki Stack (Log aggregation)
    # -------------------------------------------------------------------------
    - name: Add Grafana Helm repository
      kubernetes.core.helm_repository:
        name: grafana
        repo_url: https://grafana.github.io/helm-charts

    - name: Install Loki stack
      kubernetes.core.helm:
        name: loki
        chart_ref: grafana/loki-stack
        chart_version: "{{ loki_stack_version }}"
        release_namespace: monitoring
        kubeconfig: "{{ kubeconfig }}"
        values:
          loki:
            enabled: true
            persistence:
              enabled: false
            config:
              limits_config:
                retention_period: 168h
          promtail:
            enabled: true
          grafana:
            enabled: false  # Already installed via kube-prometheus-stack

    # -------------------------------------------------------------------------
    # Apply custom dashboards and alerting rules
    # -------------------------------------------------------------------------
    - name: Apply custom alerting rules
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/../../monitoring/prometheus/alerting-rules.yaml"
        kubeconfig: "{{ kubeconfig }}"

    - name: Create Grafana dashboard ConfigMap
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: k8s-platform-dashboards
            namespace: monitoring
            labels:
              grafana_dashboard: "1"
          data:
            cluster-overview.json: "{{ lookup('file', playbook_dir + '/../../monitoring/grafana/dashboards/cluster-overview.json') }}"
            app-metrics.json: "{{ lookup('file', playbook_dir + '/../../monitoring/grafana/dashboards/app-metrics.json') }}"

    - name: Apply Alertmanager configuration
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/../../monitoring/alertmanager/alertmanager-config.yaml"
        kubeconfig: "{{ kubeconfig }}"

    - name: Print monitoring stack status
      ansible.builtin.debug:
        msg: |
          Monitoring stack installed:
          - Prometheus: http://localhost:9090
          - Grafana: http://localhost:3000 (admin/admin)
          - Alertmanager: http://localhost:9093
          - Loki: http://localhost:3100

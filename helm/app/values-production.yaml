# Production overrides for sample-app Helm chart
# Apply with: helm upgrade --install sample-app ./helm/app -f helm/app/values-production.yaml

replicaCount: 3

image:
  pullPolicy: Always

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

env:
  LOG_LEVEL: "WARNING"
  ENVIRONMENT: "production"
  READY_AFTER_SECONDS: "5"

ingress:
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "50"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
